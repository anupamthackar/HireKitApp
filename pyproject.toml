[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hirekit"
version = "0.1.0"
description = "AI Career Operating System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "sqlmodel>=0.0.14",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "jobspy>=0.25.0",
]

[project.scripts]
hirekit = "backend.startup:main"